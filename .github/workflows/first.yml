name: "first workflow"

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  first_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: test lint
        run: npm run lint

      - name: test cases
        run: npm run test

      - name: Make react build
        run: npm run build

      - name: create artifact
        uses: actions/upload-artifact@v4
        with:
           name: react-build
           path: dist/
           retention-days: 7